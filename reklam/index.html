<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Last Breath Reklam Filmi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;500;600;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ground: #0c0d0e;
    --panel: #151618;
    --line: #2a2c2f;
    --bone: #e8dfcf;
    --muted: #9a9288;
    --blood: #b3121a;
    --bronze: #b27a45;
    --display: "Bebas Neue", Impact, "Arial Narrow", sans-serif;
    --body: Oswald, "Arial Narrow", Arial, sans-serif;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--bone);
    font-family: var(--body);
    font-weight: 300;
    padding-inline: 16px;
    padding-block: 20px 32px;
  }
  .wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 14px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 5vw, 46px); letter-spacing: .06em; margin: 0; line-height: 1; }
  h1 span { color: var(--blood); }
  .meta { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  .start {
    position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.35);
    border: 0; color: var(--bone); cursor: pointer; font-family: var(--display); font-size: clamp(22px, 4vw, 44px); letter-spacing: .12em;
  }
  .start span { border: 2px solid var(--bone); padding: .25em 1em .15em; }
  .start:hover span, .start:focus-visible span { background: var(--bone); color: #000; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  button.ctl {
    font-family: var(--body); font-weight: 500; font-size: 14px; letter-spacing: .12em; text-transform: uppercase;
    background: var(--panel); color: var(--bone); border: 1px solid var(--line); padding: 8px 14px; cursor: pointer;
  }
  button.ctl:hover { border-color: var(--bronze); }
  button.ctl:focus-visible, input:focus-visible, .start:focus-visible { outline: 2px solid var(--bronze); outline-offset: 2px; }
  button.rec { border-color: #5a1a1c; }
  input[type=range] { flex: 1 1 220px; accent-color: var(--blood); min-width: 0; }
  .time { font-variant-numeric: tabular-nums; font-size: 15px; letter-spacing: .08em; color: var(--muted); min-width: 110px; }
  .cue { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--bronze); }
  .assets { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px 18px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
  .assets div { display: flex; gap: 8px; align-items: baseline; }
  .assets b { font-weight: 500; color: var(--bone); letter-spacing: .04em; }
  .ok { color: #7fae6a; } .no { color: var(--muted); }
  .note { font-size: 13px; color: var(--muted); line-height: 1.55; max-width: 75ch; margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>LAST <span>BREATH</span> · Reklam Filmi</h1>
    <div class="meta">Ashbound Studios · 42 sn · 1920×1080</div>
  </header>

  <div class="stage">
    <canvas id="c" width="1920" height="1080" aria-label="Last Breath reklam filmi"></canvas>
    <button class="start" id="start" type="button"><span>▶ Sesli Oynat</span></button>
  </div>

  <div class="controls">
    <button class="ctl" id="play" type="button">Oynat</button>
    <button class="ctl" id="restart" type="button">Baştan</button>
    <input type="range" id="scrub" min="0" max="42" step="0.01" value="0" aria-label="Zaman çizelgesi">
    <span class="time" id="time">00.00 / 42.00</span>
    <span class="cue" id="cue">Logo</span>
    <button class="ctl rec" id="rec" type="button">● WebM Kaydet</button>
  </div>

  <div class="assets" id="assets"></div>
  <p class="note" id="note">Görseller ve müzik <b>assets/</b> klasöründen okunur; eksik olan her dosyanın yerine prosedürel çizim ve sentez ses kullanılır. Boşluk tuşu oynatır ya da duraklatır, ok tuşları yarım saniye sarar.</p>
</div>

<script>
"use strict";
/* =========================================================================
   AYARLAR — dosya adlarını ve müzik başlangıcını buradan değiştir.
   ========================================================================= */
const CONFIG = {
  duration: 42,
  // Parçanın hangi saniyesinden başlanacağı. 30 → reklamın 31. saniyesindeki
  // beyaz flaş/logo darbesi parçanın ~61. saniyesine, yani enerji zirvesine denk gelir.
  musicOffset: 30,
  musicVolume: 0.85,
  sfxVolume: 0.9,
  // Sprite'ların görseldeki "ön" yönü (radyan). 0 = sağa bakıyor, -Math.PI/2 = yukarı bakıyor.
  spriteFacing: -Math.PI / 2,
  spriteSize: 46,
  assets: {
    logo:    "assets/ashbound-logo.png",
    cover:   "assets/kapak.jpg",
    ethan:   "assets/ethan.png",
    sarah:   "assets/sarah.png",
    zombie:  "assets/zombi.png",
    runner:  "assets/kosucu.png",
    tank:    "assets/tank.png",
    armored: "assets/zirhli.png",
    music:   "assets/from-the-darkness.mp3",
  },
};

const W = 1920, H = 1080, TAU = Math.PI * 2;
const FD = '"Bebas Neue", Impact, "Arial Narrow", sans-serif';
const FB = 'Oswald, "Arial Narrow", Arial, sans-serif';
const C = { bone: "#e8dfcf", blood: "#b3121a", bloodD: "#5c0a0d", bronze: "#b27a45", copper: "#c98a52", grey: "#1b1d20", moon: "#7f9cc4" };

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const IN_FRAME = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

/* ---------- küçük yardımcılar ---------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const p = (t, a, b) => clamp((t - a) / (b - a));
const eOut = k => 1 - Math.pow(1 - k, 3);
const eIn = k => k * k * k;
const eIO = k => (k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const win = (t, a, b, f = .3) => Math.min(p(t, a, a + f), 1 - p(t, b - f, b));
function rnd(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mk(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
function circ(g, x, y, r) { g.beginPath(); g.arc(x, y, Math.max(0, r), 0, TAU); g.fill(); }
function ell(g, x, y, rx, ry, rot = 0) { g.beginPath(); g.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, TAU); g.fill(); }
function speck(g, w, h, R, n, cols) { for (let i = 0; i < n; i++) { g.fillStyle = cols[i % cols.length]; const s = 1 + R() * 3; g.fillRect(R() * w, R() * h, s, s); } }
function impulse(t, times, amp, dur) {
  let x = 0, y = 0;
  for (const s of times) { const d = t - s; if (d >= 0 && d < dur) { const k = Math.pow(1 - d / dur, 2) * amp; x += Math.sin(d * 90 + s) * k; y += Math.cos(d * 77 + s * 3) * k; } }
  return [x, y];
}

/* ---------- varlıklar ---------- */
const IMG = {};
const assetState = {};
let musicEl = null, musicOk = false;
function loadAssets() {
  const list = [];
  for (const [k, src] of Object.entries(CONFIG.assets)) {
    if (k === "music") continue;
    list.push(new Promise(res => {
      const im = new Image();
      im.onload = () => { IMG[k] = im; assetState[k] = true; res(); };
      im.onerror = () => { assetState[k] = false; res(); };
      im.src = src;
    }));
  }
  musicEl = new Audio();
  musicEl.preload = "auto";
  musicEl.addEventListener("canplaythrough", () => { if (!musicOk) { musicOk = true; assetState.music = true; hookMusic(); renderAssetList(); } }, { once: true });
  musicEl.addEventListener("error", () => { assetState.music = false; renderAssetList(); }, { once: true });
  musicEl.src = CONFIG.assets.music;
  return Promise.all(list);
}
const ASSET_LABEL = { logo: "Ashbound logosu", cover: "Kapak görseli", ethan: "Ethan sprite", sarah: "Sarah sprite", zombie: "Normal zombi", runner: "Koşucu", tank: "Tank", armored: "Zırhlı", music: "From the Darkness" };
function renderAssetList() {
  const el = document.getElementById("assets");
  el.innerHTML = Object.keys(CONFIG.assets).map(k => {
    const s = assetState[k];
    const tag = s === true ? '<span class="ok">yüklendi</span>' : s === false ? '<span class="no">yedek kullanılıyor</span>' : '<span class="no">bekleniyor</span>';
    return `<div><b>${ASSET_LABEL[k]}</b>${tag}</div>`;
  }).join("");
}

/* ---------- prosedürel haritalar ---------- */
let CITY, BASE, GRAIN = [], VIGNETTE, LIGHT, LX, TMP, TX, TITLE;

function makeCity() {
  const S = 3000, c = mk(S, S), g = c.getContext("2d"), R = mulberry(7);
  g.fillStyle = "#16181b"; g.fillRect(0, 0, S, S);
  speck(g, S, S, R, 30000, ["#1c1f23", "#121315", "#202328", "#191b1e"]);
  g.translate(S / 2, S / 2);
  const roads = [-1000, 0, 1000], RW = 190, SW = 45;
  // kaldırımlar + yol
  for (const r of roads) {
    g.fillStyle = "#25282c"; g.fillRect(r - RW - SW, -1500, (RW + SW) * 2, 3000); g.fillRect(-1500, r - RW - SW, 3000, (RW + SW) * 2);
  }
  for (const r of roads) {
    g.fillStyle = "#1a1c1f"; g.fillRect(r - RW, -1500, RW * 2, 3000); g.fillRect(-1500, r - RW, 3000, RW * 2);
  }
  // kaldırım taşı derzleri
  g.strokeStyle = "rgba(0,0,0,.35)"; g.lineWidth = 2;
  for (const r of roads) for (let s = -1500; s < 1500; s += 48) {
    for (const side of [-1, 1]) {
      const o = r + side * (RW + SW / 2);
      g.beginPath(); g.moveTo(o - SW / 2, s); g.lineTo(o + SW / 2, s); g.stroke();
      g.beginPath(); g.moveTo(s, o - SW / 2); g.lineTo(s, o + SW / 2); g.stroke();
    }
  }
  // asfalt dokusu (yeniden)
  for (let i = 0; i < 16000; i++) {
    const r = roads[i % 3], vert = i % 2 === 0; const a = (R() - .5) * 2 * RW, b = R() * 3000 - 1500;
    g.fillStyle = R() < .5 ? "#202226" : "#141517"; const s = 1 + R() * 2.5;
    vert ? g.fillRect(r + a, b, s, s) : g.fillRect(b, r + a, s, s);
  }
  // şerit çizgileri
  g.fillStyle = "rgba(170,145,70,.32)";
  for (const r of roads) for (let s = -1500; s < 1500; s += 90) {
    if (roads.some(q => Math.abs(s + 22 - q) < RW + 20)) continue;
    g.fillRect(r - 3, s, 6, 46); g.fillRect(s, r - 3, 46, 6);
  }
  // yaya geçitleri
  g.fillStyle = "rgba(120,120,115,.22)";
  for (const a of roads) for (const b of roads) for (const d of [-1, 1]) for (let k = -RW + 15; k < RW - 15; k += 34) {
    g.fillRect(a + k, b + d * (RW + 6) - (d < 0 ? 40 : 0), 18, 40);
    g.fillRect(a + d * (RW + 6) - (d < 0 ? 40 : 0), b + k, 40, 18);
  }
  // bloklar
  const E = [-1500, -1000, 0, 1000, 1500];
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
    const x0 = E[i] + (i === 0 ? 0 : RW + SW), x1 = E[i + 1] - (i === 3 ? 0 : RW + SW);
    const y0 = E[j] + (j === 0 ? 0 : RW + SW), y1 = E[j + 1] - (j === 3 ? 0 : RW + SW);
    const suburb = (i < 2 && j >= 2) || (i >= 2 && j < 2 && i + j === 3);
    if (suburb) {
      g.fillStyle = "#121a14"; g.fillRect(x0, y0, x1 - x0, y1 - y0);
      for (let n = 0; n < 1800; n++) { g.fillStyle = R() < .5 ? "#18221a" : "#0e140f"; g.fillRect(x0 + R() * (x1 - x0), y0 + R() * (y1 - y0), 3, 3); }
      for (let hx = x0 + 40; hx + 200 < x1; hx += 250) for (let hy = y0 + 40; hy + 170 < y1; hy += 230) {
        const w = 150 + R() * 40, h = 110 + R() * 30;
        g.fillStyle = "#1c1e21"; g.fillRect(hx + w / 2 - 20, hy + h, 40, 60);
        g.fillStyle = "#2a2421"; g.fillRect(hx, hy, w, h / 2);
        g.fillStyle = "#211c1a"; g.fillRect(hx, hy + h / 2, w, h / 2);
        g.strokeStyle = "#3b322c"; g.lineWidth = 3; g.beginPath(); g.moveTo(hx, hy + h / 2); g.lineTo(hx + w, hy + h / 2); g.stroke();
        g.strokeStyle = "#0b0c0c"; g.lineWidth = 4; g.strokeRect(hx, hy, w, h);
        g.strokeStyle = "rgba(90,80,60,.35)"; g.lineWidth = 2; g.setLineDash([8, 6]); g.strokeRect(hx - 25, hy - 25, w + 50, h + 90); g.setLineDash([]);
        if (R() < .4) { g.fillStyle = "#0a0a0a"; ell(g, hx + R() * w, hy + R() * h, 18, 12); }
      }
    } else {
      let cx = x0 + 25;
      while (cx < x1 - 120) {
        const bw = Math.min(x1 - 25 - cx, 200 + R() * 320);
        let cy = y0 + 25;
        while (cy < y1 - 120) {
          const bh = Math.min(y1 - 25 - cy, 180 + R() * 360);
          const tone = 26 + Math.floor(R() * 10);
          g.fillStyle = `rgb(${tone},${tone + 2},${tone + 5})`; g.fillRect(cx, cy, bw, bh);
          g.strokeStyle = "#0a0b0c"; g.lineWidth = 8; g.strokeRect(cx, cy, bw, bh);
          g.strokeStyle = "rgba(255,255,255,.05)"; g.lineWidth = 3; g.strokeRect(cx + 12, cy + 12, bw - 24, bh - 24);
          for (let n = 0; n < 3 + R() * 5; n++) { g.fillStyle = "#373b40"; const w = 26 + R() * 30; g.fillRect(cx + 20 + R() * (bw - 70), cy + 20 + R() * (bh - 70), w, w * .7); }
          if (R() < .5) { g.fillStyle = "#0d1115"; g.fillRect(cx + bw * .3, cy + bh * .3, bw * .2, bh * .15); }
          if (R() < .35) { g.fillStyle = "#2f2a24"; circ(g, cx + bw - 50, cy + 50, 26); g.strokeStyle = "#1a1714"; g.lineWidth = 3; g.stroke(); }
          for (let n = 0; n < 400; n++) { g.fillStyle = R() < .5 ? "rgba(0,0,0,.25)" : "rgba(255,255,255,.03)"; g.fillRect(cx + R() * bw, cy + R() * bh, 3, 3); }
          cy += bh + 30;
        }
        cx += bw + 30;
      }
    }
  }
  roadDetails(g, R, roads, RW);
  return c;
}
function roadDetails(g, R, roads, RW) {
  const onRoad = () => { const r = roads[Math.floor(R() * 3)], a = (R() - .5) * 2 * RW * .9, b = R() * 3000 - 1500; return R() < .5 ? [r + a, b] : [b, r + a]; };
  // çatlaklar
  g.lineCap = "round";
  for (let i = 0; i < 420; i++) {
    let [x, y] = onRoad(); g.strokeStyle = "#08090a"; g.lineWidth = 1 + R() * 2.5; g.beginPath(); g.moveTo(x, y);
    let a = R() * TAU; for (let s = 0; s < 4 + R() * 7; s++) { a += (R() - .5) * 1.4; x += Math.cos(a) * (10 + R() * 26); y += Math.sin(a) * (10 + R() * 26); g.lineTo(x, y); }
    g.stroke();
  }
  // ıslak birikintiler
  for (let i = 0; i < 110; i++) {
    const [x, y] = onRoad(); const rx = 30 + R() * 90, ry = 14 + R() * 40, rot = R() * TAU;
    g.fillStyle = "rgba(55,80,115,.22)"; ell(g, x, y, rx, ry, rot);
    g.strokeStyle = "rgba(140,170,210,.10)"; g.lineWidth = 2; g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, TAU); g.stroke();
  }
  // eski kan / yağ lekeleri
  for (let i = 0; i < 70; i++) { const [x, y] = onRoad(); g.fillStyle = i % 3 ? "rgba(8,8,8,.45)" : "rgba(60,8,10,.45)"; for (let k = 0; k < 5; k++) circ(g, x + (R() - .5) * 40, y + (R() - .5) * 40, 6 + R() * 18); }
  // hurda arabalar
  for (let i = 0; i < 30; i++) {
    const [x, y] = onRoad(); const rot = R() * TAU, cols = ["#2b3035", "#3a2b27", "#2c3329", "#3d3a33", "#23262b"];
    g.save(); g.translate(x, y); g.rotate(rot);
    g.fillStyle = "rgba(0,0,0,.5)"; g.fillRect(-46, -20, 100, 50);
    g.fillStyle = cols[i % cols.length]; g.fillRect(-50, -24, 100, 48);
    g.fillStyle = "#0c1013"; g.fillRect(-18, -19, 18, 38); g.fillRect(18, -18, 12, 36);
    g.fillStyle = "rgba(120,60,30,.35)"; for (let k = 0; k < 5; k++) circ(g, (R() - .5) * 90, (R() - .5) * 40, 3 + R() * 6);
    g.strokeStyle = "#0a0a0a"; g.lineWidth = 3; g.strokeRect(-50, -24, 100, 48);
    g.restore();
  }
  // kâğıt, moloz
  for (let i = 0; i < 600; i++) { const [x, y] = onRoad(); g.fillStyle = R() < .3 ? "rgba(180,170,150,.18)" : "rgba(40,40,42,.8)"; g.save(); g.translate(x, y); g.rotate(R() * TAU); g.fillRect(-4, -3, 6 + R() * 8, 4 + R() * 5); g.restore(); }
}

function makeBase() {
  const S = 2600, c = mk(S, S), g = c.getContext("2d"), R = mulberry(21);
  g.fillStyle = "#212428"; g.fillRect(0, 0, S, S);
  speck(g, S, S, R, 26000, ["#272a2f", "#1a1c1f", "#2b2e33"]);
  g.translate(S / 2, S / 2);
  g.strokeStyle = "#17191c"; g.lineWidth = 3;
  for (let k = -1300; k <= 1300; k += 160) { g.beginPath(); g.moveTo(k, -1300); g.lineTo(k, 1300); g.stroke(); g.beginPath(); g.moveTo(-1300, k); g.lineTo(1300, k); g.stroke(); }
  // zemin yazısı
  g.save(); g.fillStyle = "rgba(170,145,70,.22)"; g.font = `700 150px ${FB}`; g.textAlign = "center";
  if ("letterSpacing" in g) g.letterSpacing = "30px";
  g.fillText("KARTAL ÜSSÜ", 40, 120); g.font = `600 70px ${FB}`; g.fillText("BÖLGE K-7 · YETKİSİZ GİRİŞ YASAK", 40, 230); g.restore();
  // helipad
  g.strokeStyle = "rgba(200,190,160,.25)"; g.lineWidth = 10; g.beginPath(); g.arc(-620, 560, 180, 0, TAU); g.stroke();
  g.fillStyle = "rgba(200,190,160,.25)"; g.font = `700 200px ${FB}`; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("H", -620, 570);
  // iç yollar
  g.fillStyle = "rgba(170,145,70,.3)";
  for (let s = -1200; s < 1200; s += 80) { g.fillRect(s, -700, 44, 6); g.fillRect(900, s, 6, 44); }
  // konteynerler
  const cont = [["#34423a", -900, -250, 0], ["#5a3b22", -880, -150, 0], ["#394250", -500, 700, .05], ["#34423a", 500, 650, -.04], ["#5a3b22", 560, 760, -.04], ["#394250", 980, -100, 1.57]];
  for (const [col, x, y, r] of cont) {
    g.save(); g.translate(x, y); g.rotate(r); g.fillStyle = "rgba(0,0,0,.5)"; g.fillRect(-116, -30, 240, 76);
    g.fillStyle = col; g.fillRect(-120, -36, 240, 72); g.strokeStyle = "rgba(0,0,0,.35)"; g.lineWidth = 2;
    for (let k = -110; k < 120; k += 14) { g.beginPath(); g.moveTo(k, -36); g.lineTo(k, 36); g.stroke(); }
    g.restore();
  }
  // jeneratörler
  for (const [x, y] of GENS) {
    g.fillStyle = "rgba(0,0,0,.5)"; g.fillRect(x - 64, y - 30, 140, 80);
    g.fillStyle = "#3a3d33"; g.fillRect(x - 70, y - 38, 140, 76); g.fillStyle = "#23251f";
    for (let k = 0; k < 6; k++) g.fillRect(x - 55 + k * 18, y - 26, 10, 52);
    g.strokeStyle = "#0b0c0a"; g.lineWidth = 4; g.strokeRect(x - 70, y - 38, 140, 76);
    g.strokeStyle = "#111"; g.lineWidth = 6; g.beginPath(); g.moveTo(x + 70, y); g.bezierCurveTo(x + 160, y + 20, x + 180, y - 120, x + 300, y - 90); g.stroke();
  }
  // kum torbaları
  for (let i = 0; i < 5; i++) { const bx = -300 + i * 160, by = -620 + (i % 2) * 40; for (let k = 0; k < 7; k++) { g.fillStyle = k % 2 ? "#5d523b" : "#6b5f45"; ell(g, bx + k * 18, by, 12, 8); } }
  // çit
  g.strokeStyle = "#4a4d52"; g.lineWidth = 3;

  shimmer: (at, dur = 1.6) => { [1318.5, 1975.5, 2637, 3951].forEach((f, i) => tone(at, dur * .5, { f, peak: .035 / (i + 1) * 2, a: dur * .5 })); nz(at, dur * .4, { type: "highpass", f: 6500, peak: .07, a: dur * .6 }); },
  thunder: at => { nz(at, .12, { type: "highpass", f: 2500, peak: .55 }); nz(at + .05, 3.4, { f: 520, f2: 70, peak: 1.1, a: .08 }); tone(at, 2.4, { f: 44, f2: 24, peak: .6 }); },
  riser: (at, dur = 4) => { nz(at, .12, { type: "bandpass", f: 180, f2: 4200, q: 2.2, peak: .4, a: dur }); tone(at, .1, { type: "triangle", f: 55, f2: 110, peak: .25, a: dur }); },
  growl: (at, low = false) => {
    const o = AC.createOscillator(), l = AC.createOscillator(), lg = AC.createGain(), fl = AC.createBiquadFilter(), g = AC.createGain();
    o.type = "sawtooth"; o.frequency.value = low ? 42 : 78; l.frequency.value = low ? 5 : 9; lg.gain.value = low ? 8 : 14; fl.type = "lowpass"; fl.frequency.value = low ? 300 : 520;
    l.connect(lg).connect(o.frequency); env(g.gain, at, .15, (low ? .45 : .2) * CONFIG.sfxVolume, low ? 1.6 : .8);
    o.connect(fl).connect(g).connect(bus); o.start(at); l.start(at); o.stop(at + 2); l.stop(at + 2);
  },
  ritual: (at, dur = 2) => {
    [110, 116.5, 164.8, 55].forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain(), tr = AC.createOscillator(), tg = AC.createGain();
      o.frequency.value = f; tr.frequency.value = 5 + i; tg.gain.value = .04; tr.connect(tg).connect(g.gain);
      env(g.gain, at, .5, .07 * CONFIG.sfxVolume, dur - .5); o.connect(g).connect(bus); o.start(at); tr.start(at); o.stop(at + dur + .2); tr.stop(at + dur + .2);
    });
  },
};
const CUES = (() => {
  const c = [[.6, "softThud"], [1.2, "shimmer", 1.5], [4.4, "whoosh"], [6.2, "growl"], [8.7, "growl"],
    [10.5, "cut"], [11.3, "slash"], [12.5, "cut"], [12.9, "shotgun"], [13.6, "shotgun"], [13.85, "shimmer", .6], [14.5, "cut"], [14.8, "shot"],
    ...C3_EXPL.map(e => [e, "boom"]), [16.5, "cut"], [16.5, "ritual", 2], [17.2, "growl"], [18.5, "cut"],
    ...TANK_STEPS.map(s => [s, "thud"]), ...LIGHTNING.slice(0, 1).map(s => [s, "thunder"]), [20.5, "cut"],
    [20.9, "smg"], ...S3.eShots.map(s => [s, "shotgun"]), ...S3.sBursts.map(s => [s, "smg"]),
    [26.5, "cut"], [26.9, "softThud"], [27, "riser", 3.95], [28.8, "growl", true], [29.62, "thud"], [30.4, "whoosh"],
    [31, "hit"], [32.5, "shimmer", 1.2], [36.9, "whoosh"], [38.1, "softThud"]];
  return c.sort((a, b) => a[0] - b[0]);
})();
function interp(keys, t) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) return lerp(keys[i - 1][1], keys[i][1], (t - keys[i - 1][0]) / (keys[i][0] - keys[i - 1][0]));
  return keys[keys.length - 1][1];
}
function keyframes(pr, keys, t0, now) {
  pr.cancelScheduledValues(now); pr.setValueAtTime(Math.max(.0001, interp(keys, t0)), now);
  for (const [t, v] of keys) if (t > t0) pr.linearRampToValueAtTime(v, now + (t - t0));

const DRONE_KEYS = [[0, 0], [1.2, .3], [4.5, .22], [26.5, .3], [30.9, .5], [31, 0], [31.4, .28], [40.5, .25], [42, 0]];
const RAIN_KEYS = [[0, 0], [4.5, 0], [5.4, .11], [18.5, .12], [19, .2], [20.5, .1], [26.5, .03], [31, 0]];
const MUSIC_KEYS = [[0, 0], [1.5, 1], [40.5, 1], [42, 0]];
function startAudio(t0) {
  initAudio(); AC.resume();
  bus = AC.createGain(); bus.connect(master);
  const now = AC.currentTime + .06;
  for (const [t, name, arg] of CUES) if (t >= t0) SFX[name](now + (t - t0), arg);
  // uğultu
  const fl = AC.createBiquadFilter(); fl.type = "lowpass"; fl.frequency.value = 160; const dg = AC.createGain();
  [36.7, 55.1, 36.9].forEach(f => { const o = AC.createOscillator(); o.type = "sawtooth"; o.frequency.value = f; o.connect(fl); o.start(now); loops.push(o); });
  fl.connect(dg).connect(bus); keyframes(dg.gain, DRONE_KEYS, t0, now);
  // yağmur
  const rs = AC.createBufferSource(); rs.buffer = noiseBuf; rs.loop = true; const hp = AC.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 900;
  const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 7000; const rg = AC.createGain();
  rs.connect(hp).connect(lp).connect(rg).connect(bus); rs.start(now); loops.push(rs); keyframes(rg.gain, RAIN_KEYS, t0, now);

  if (musicOk && musicGain) {
    try { musicEl.currentTime = CONFIG.musicOffset + t0; musicEl.play(); } catch (e) {}
    keyframes(musicGain.gain, MUSIC_KEYS.map(([t, v]) => [t, v * CONFIG.musicVolume]), t0, now);
  }

}
function stopAudio() {
  if (!AC) return;
  loops.forEach(n => { try { n.stop(); } catch (e) {} }); loops = [];
  if (bus) { bus.disconnect(); bus = null; }
  if (musicEl) musicEl.pause();
  if (musicGain) { musicGain.gain.cancelScheduledValues(AC.currentTime); musicGain.gain.setValueAtTime(0, AC.currentTime); }
}

/* =========================================================================
   OYNATICI
   ========================================================================= */
const ui = { play: document.getElementById("play"), restart: document.getElementById("restart"), scrub: document.getElementById("scrub"), time: document.getElementById("time"), cue: document.getElementById("cue"), rec: document.getElementById("rec"), start: document.getElementById("start") };
let playing = false, T = 0, clock0 = 0, t0 = 0, recorder = null;
const nowS = () => AC ? AC.currentTime : performance.now() / 1000;
function play(from = T) {
  if (from >= CONFIG.duration - .05) from = 0;
  stopAudio(); t0 = from; clock0 = startAudio(from); playing = true; ui.play.textContent = "Duraklat"; ui.start.hidden = true;
}
function pause() { playing = false; stopAudio(); ui.play.textContent = "Oynat"; }
function fmt(v) { return v.toFixed(2).padStart(5, "0"); }
function tick() {
  if (playing) {
    T = Math.max(0, t0 + (nowS() - clock0));
    if (T >= CONFIG.duration) { T = CONFIG.duration; pause(); if (recorder) recorder.stop(); }
  }
  const name = render(Math.min(T, CONFIG.duration - .001));
  ui.scrub.value = T; ui.time.textContent = `${fmt(T)} / ${fmt(CONFIG.duration)}`; ui.cue.textContent = name;
  requestAnimationFrame(tick);
}
ui.start.addEventListener("click", () => play(0));
ui.play.addEventListener("click", () => playing ? pause() : play());
ui.restart.addEventListener("click", () => play(0));
ui.scrub.addEventListener("input", () => { T = +ui.scrub.value; if (playing) play(T); });
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.key !== " ") return;
  if (e.key === " ") { e.preventDefault(); playing ? pause() : play(); }
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") { T = clamp(T + (e.key === "ArrowRight" ? .5 : -.5), 0, CONFIG.duration); if (playing) play(T); }
});
ui.rec.addEventListener("click", () => {
  if (recorder) return;
  try {
    initAudio();
    const types = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
    const mimeType = types.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
    const stream = new MediaStream([...canvas.captureStream(60).getVideoTracks(), ...recDest.stream.getAudioTracks()]);
    const chunks = [];
    recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 16e6 });
    recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
    recorder.onstop = () => {
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(chunks, { type: "video/webm" }));
      a.download = "last-breath-reklam.webm"; document.body.appendChild(a); a.click(); a.remove();
      recorder = null; ui.rec.textContent = "● WebM Kaydet";
    };
    recorder.start(250); ui.rec.textContent = "● Kaydediliyor…"; play(0);
  } catch (e) {
    recorder = null;
    document.getElementById("note").textContent = "Kayıt başlatılamadı: " + e.message + ". Sayfayı yerel bir sunucudan aç (README'ye bak).";
  }
});
if (IN_FRAME) ui.rec.hidden = true;

(async function boot() {
  renderAssetList();
  makeFx();
  render(0);
  try { await Promise.all([document.fonts.load(`400 100px "Bebas Neue"`), document.fonts.load(`700 100px Oswald`), document.fonts.load(`400 100px Oswald`), document.fonts.load(`600 100px Oswald`)]); } catch (e) {}
  await loadAssets(); renderAssetList();
  CITY = makeCity(); BASE = makeBase(); TITLE = makeTitle();
  const q = new URLSearchParams(location.search).get("t"); if (q) T = clamp(+q || 0, 0, CONFIG.duration);
  requestAnimationFrame(tick);
})();
</script>
