const TV_KEYS = [[0, 0], [8, 0], [8.05, .16], [14.7, .16], [14.75, .32], [15.35, .32], [15.45, 0]];
const HUM_KEYS = [[0, 0], [52, 0], [52.05, .06], [64.9, .06], [65, 0]];
const SIREN_KEYS = [[0, 0], [29.5, 0], [31, .05], [36, .05], [37.9, 0]];
function musicKeys() {
  const M = CONFIG.music, v = M.volume, keys = [[0, 0], [M.startAt, 0], [M.startAt + 3, v]];

  for (const d of DIALOG) { if (d.a > M.cutAt && d.a < M.resumeAt) continue; const w = [d.a - .35, d.b + .45]; const lw = wins[wins.length - 1]; if (lw && w[0] - lw[1] < .5) lw[1] = w[1]; else wins.push(w); }

let CUES = [];
function buildCues() {
  const c = [[.8, "riser", 2.8], [3.9, "shimmer", 1.6], [8, "tvOn"], [14.75, "glitch"], [15.35, "tvOff"], [16.2, "softThud"], [20, "whoosh"],
    [29.5, "cut"], [31.6, "growl", true], [33.9, "growl"], [36.2, "growl", true],
    [38, "smg", 3], [38.25, "growl"], [49.4, "growl"], [50.3, "growl"], [51.2, "growl", true],
    [52, "softThud"], [59.6, "cut"], [61.4, "whoosh"], [63.9, "thud"], [64.1, "growl", true],

function makeNoise(ac) { const b = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), d = b.getChannelData(0), R = mulberry(77); for (let i = 0; i < d.length; i++) d[i] = R() * 2 - 1; return b; }

/* ---------- çevrimdışı render arayüzü (render.mjs kullanır) ---------- */
let WAV = null;
