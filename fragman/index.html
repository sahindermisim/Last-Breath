<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Last Breath Duyuru Fragmanı</title>
<style>
  @font-face { font-family: "Bebas Neue"; font-weight: 400; src: url(fonts/bebas-latin.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Bebas Neue"; font-weight: 400; src: url(fonts/bebas-latin-ext.woff2) format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: "Oswald"; font-weight: 200 700; src: url(fonts/oswald-latin.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Oswald"; font-weight: 200 700; src: url(fonts/oswald-latin-ext.woff2) format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  :root { color-scheme: dark; --ground: #0b0a0c; --panel: #151417; --line: #2b292d; --bone: #e9e2d2; --muted: #9b948a; --blood: #e0342b; --bronze: #c08f53; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--bone); font-family: Oswald, "Arial Narrow", sans-serif; font-weight: 300; padding-inline: 16px; padding-block: 20px 32px; }
  body.render { padding: 0; }
  body.render .ui { display: none; }
  .wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 14px; }
  h1 { font-family: "Bebas Neue", Impact, sans-serif; font-weight: 400; font-size: clamp(28px, 5vw, 44px); letter-spacing: .06em; margin: 0; line-height: 1; }
  h1 span { color: var(--blood); }
  .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  body.render .stage { width: 1920px; height: 1080px; }
  canvas { display: block; width: 100%; height: 100%; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  button { font: 500 14px Oswald, sans-serif; letter-spacing: .12em; text-transform: uppercase; background: var(--panel); color: var(--bone); border: 1px solid var(--line); padding: 8px 14px; cursor: pointer; }
  button:hover { border-color: var(--bronze); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--bronze); outline-offset: 2px; }
  input[type=range] { flex: 1 1 220px; accent-color: var(--blood); min-width: 0; }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 120px; }
  .assets { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px 18px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
  .assets b { font-weight: 500; color: var(--bone); margin-right: 8px; }
  .ok { color: #8fb37a; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="ui">LAST <span>BREATH</span> · Fragman önizleme</h1>
  <div class="stage"><canvas id="c" width="1920" height="1080" aria-label="Last Breath fragmanı"></canvas></div>
  <div class="controls ui">
    <button id="play" type="button">Sesli oynat</button>
    <input type="range" id="scrub" min="0" max="120" step="0.01" value="0" aria-label="Zaman çizelgesi">
    <span class="time" id="time">0:00.00</span>
  </div>
  <div class="assets ui" id="assets"></div>
</div>

<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/side.js"></script>
<script src="js/scenes.js"></script>
<script src="js/film/rig.js"></script>
<script src="js/film/world.js"></script>
<script src="js/film/shots.js"></script>
<script src="js/film/timeline.js"></script>
<script src="js/audio.js"></script>
<script src="js/main.js"></script>
</body>
</html>
