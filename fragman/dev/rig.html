<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="../js/config.js"></script><script src="../js/core.js"></script><script src="../js/side.js"></script><script src="../js/film/rig.js"></script>
<script>
// Karakter test sayfası: ?t=saniye  ?v=1 yakın plan
const q = new URLSearchParams(location.search), t = +(q.get("t") || 0), v = +(q.get("v") || 0);
const g = ctx;
const gr = g.createLinearGradient(0,0,0,H); gr.addColorStop(0,"#1b2230"); gr.addColorStop(.7,"#39424f"); gr.addColorStop(1,"#0d1015"); g.fillStyle=gr; g.fillRect(0,0,W,H);
const glowAt=(x,y,r,c,a)=>{const q=g.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,`rgba(${c},${a})`);q.addColorStop(1,`rgba(${c},0)`);g.fillStyle=q;g.fillRect(x-r,y-r,2*r,2*r);};
glowAt(960,760,800,"255,122,42",.4);
const rimR = {c:"rgba(255,140,60,.95)",dx:3}, rimL = {c:"rgba(255,140,60,.95)",dx:-3}; if (q.get("nr")) F.figure0 = F.figure, F.figure = (g,x,y,s,d,B,P,o)=>{ const r=(o.rims||[])[0]; if (r) { o.light = F.light(o); o.rims = []; } return F.figure0(g,x,y,s,d,B,P,o); };
if (!v) {
const s=2.1, y0=880;
F.figure(g, 170, y0, s, 1, F.BUILD.ethan, F.P.walk(t*6), {t, weapon:"machete", bladeRim:"rgba(220,230,240,.6)", rims:[rimR]});
F.figure(g, 420, y0, s, 1, F.BUILD.ethan, F.P.stand(t), {t, weapon:"machete", rims:[rimL]});
F.figure(g, 660, y0, s*.97, -1, F.BUILD.sarah, F.P.walk(t*6+1), {t, weapon:"smg", rims:[rimL]});
F.figure(g, 880, y0, s*.97, 1, F.BUILD.sarah, F.P.stand(t), {t, rims:[rimR]});
["normal","armored","bloated","runner"].forEach((ty,i)=>{ const B=F.zombieBuild(i+1,ty); F.figure(g, 1080+i*170, y0, s, -1, B, F.P.shamble(t*3+i, B, i), {t, rims:[rimR]}); });
F.figure(g, 1800, y0+10, s*.55, -1, F.BUILD.tank, F.P.roar(.6), {t, jaw:.8, rims:[rimR]});
F.figure(g, 120, 440, 1.3, 1, F.BUILD.ethan, F.front(), {t, front:true, back:true, weapon:"machete", rims:[rimR]});
F.figure(g, 260, 440, 1.3, 1, F.BUILD.ethan, F.front(), {t, front:true, weapon:"machete", rims:[rimR]});
F.figure(g, 400, 440, 1.3, 1, F.BUILD.sarah, F.front(), {t, front:true, rims:[rimR]});
F.figure(g, 520, 440, 1.3, 1, F.BUILD.sarah, F.front(), {t, front:true, back:true, rims:[rimR]});
["normal","armored","bloated","runner","normal"].forEach((ty,i)=>{ const B=F.zombieBuild(i+7,ty); F.figure(g, 660+i*120, 440, 1.3, 1, B, F.frontWalk(t*3+i, B, i), {t, front:true, rims:[rimR]}); });
F.figure(g, 1340, 440, 1.3, 1, F.BUILD.sarah, F.P.sit(t), {t, weapon:"smg", rims:[rimR]});
F.figure(g, 1520, 440, 1.3, 1, F.BUILD.ethan, F.P.run(t*8), {t, weapon:"machete", rims:[rimR]});
F.figure(g, 1700, 440, 1.3, 1, F.BUILD.ethan, F.P.swing(.4), {t, weapon:"machete", rims:[rimR]});
F.figure(g, 1840, 440, 1.3, -1, F.BUILD.sarah, F.P.run(t*8), {t, weapon:"smg", rims:[rimR]});
} else {
F.figure(g, 560, 1900, 7.2, 1, F.BUILD.ethan, F.P.face(t), {t, rims:[{c:"rgba(255,135,60,1)",dx:1.1,dy:-.3}]});
F.figure(g, 1360, 1870, 7.2, -1, F.BUILD.sarah, F.P.face(t), {t, rims:[{c:"rgba(255,135,60,1)",dx:-1.1,dy:-.3}]});
}
window.done=true;
</script></body></html>
